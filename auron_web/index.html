<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURON · Trợ lý Echem Studio</title>
<style>
  :root{ --c:#3DE0FF; --bg:#05080D; --panel:rgba(9,14,22,.82); --line:#1F2B3B; --text:#E8EEF4; --muted:#93A3B6; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,sans-serif;overflow:hidden}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #gl:active{cursor:grabbing}
  .brain{display:flex;flex-direction:column;gap:8px;width:100%}
  .bar{height:6px;border-radius:3px;background:#1A2433;overflow:hidden;display:none}
  .bar i{display:block;height:100%;width:0;background:var(--c);transition:width .3s}
  #bstat{font-size:13px;color:var(--muted);line-height:1.5}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .label{font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:2px;color:var(--muted);margin-right:6px}
  button{font-family:inherit;font-size:14px;color:var(--text);background:#111A27;border:1px solid #263347;border-radius:12px;min-height:44px;padding:0 12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:border-color .2s,background .2s}
  button:hover{border-color:#3A4D66;background:#152132}
  button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
  button[aria-pressed="true"]{border-color:var(--c);background:#0F2A33}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  select{font-family:inherit;font-size:14px;color:var(--text);background:#0B121C;border:1px solid #263347;border-radius:12px;min-height:44px;padding:0 12px}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 10px currentColor}
  select,input[type=text]{font-family:inherit;font-size:14px;color:var(--text);background:#0B121C;border:1px solid #263347;border-radius:12px;min-height:44px;padding:0 12px}
  input[type=text]{flex:1;min-width:180px}
  select:focus-visible,input:focus-visible{outline:2px solid var(--c);outline-offset:2px}
  .rng{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .rng input{accent-color:var(--c);width:110px}
  #vnote{font-size:13px;color:#FFC857;line-height:1.5;display:none;width:100%}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}

  .brand{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:20px;letter-spacing:4px;color:var(--c);transition:color .4s}
  .sub{font-size:12px;color:var(--muted);line-height:1.4}
  /* khung trả lời: rộng, cao, bên phải */
  #chat{position:fixed;right:16px;top:16px;bottom:16px;width:min(640px,48vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(8px)}
  #chatTop{display:flex;align-items:baseline;gap:12px}
  #log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;scroll-behavior:smooth}
  .msg,#say{font-size:15px;line-height:1.65;white-space:pre-wrap;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.045);word-wrap:break-word}
  #say:empty{display:none}
  .msg.you{align-self:flex-end;background:#0F2A33;color:#CFEFF6;max-width:86%;font-size:14px}
  .msg.dg{border:1px solid var(--c);background:rgba(61,224,255,.07)}
  .msg .tt{font-weight:600;color:var(--c);margin-bottom:4px;font-size:13px;letter-spacing:.5px}
  #sayForm{display:flex;gap:8px;align-items:center}
  #goiY{gap:6px}
  #goiY button{min-height:32px;font-size:13px;padding:0 10px;border-radius:16px}
  /* bảng điều khiển nhỏ, bên trái, kéo được và thu gọn được */
  #ctl{position:fixed;left:12px;top:14px;width:246px;max-height:calc(100vh - 28px);background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;backdrop-filter:blur(8px);transition:transform .28s ease;z-index:5}
  #ctl.min{transform:translateX(calc(-100% + 44px))}
  #ctlHead{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;cursor:grab;user-select:none;touch-action:none;border-bottom:1px solid var(--line)}
  #ctlHead:active{cursor:grabbing}
  #ctlMin{min-height:30px;width:30px;padding:0;justify-content:center;border-radius:9px}
  #ctlBody{padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
  #ctlBody button,#ctlBody select{min-height:34px;font-size:13px;border-radius:10px;width:100%}
  #ctlBody .r2{display:flex;gap:6px}
  #ctlBody .r2 button{padding:0 6px;justify-content:center}
  #ctlBody .rng{justify-content:space-between}
  #ctlBody .rng input{width:120px}
  #ctlBody hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
  @media (max-width:760px){ #chat{width:calc(100vw - 32px);top:auto;height:48vh} #ctl{width:210px} }
</style>
</head>
<body>
<canvas id="gl" aria-label="Mô hình 3D trợ lý hologram AURON, kéo để xoay" role="img"></canvas>
<aside id="ctl" aria-label="Bảng điều khiển">
  <div id="ctlHead"><button id="ctlMin" type="button" aria-label="Thu gọn hoặc mở rộng bảng điều khiển" title="Thu gọn / mở rộng (kéo thanh này để di chuyển)">◂</button><span class="label" style="margin:0">ĐIỀU KHIỂN</span></div>
  <div id="ctlBody">
    <div class="r2"><button id="tVoice" aria-pressed="true">Đọc to</button><button id="tFx" aria-pressed="true">Hiệu ứng</button></div>
    <label for="vSel" class="sr">Giọng</label><select id="vSel" aria-label="Chọn giọng đọc"></select>
    <select id="vMode" aria-label="Kiểu đọc">
      <option value="robot" selected>Kiểu đọc: máy móc</option>
      <option value="system">Kiểu đọc: hệ thống</option>
      <option value="natural">Kiểu đọc: tự nhiên</option>
    </select>
    <label class="rng">Cao độ <input id="vPitch" type="range" min="0.1" max="1.6" step="0.05" value="0.35"></label>
    <label class="rng">Tốc độ <input id="vRate" type="range" min="0.6" max="1.4" step="0.05" value="1.0"></label>
    <div id="vnote"></div>
    <div class="r2"><button id="tLook" aria-pressed="true">Mắt theo chuột</button><button id="tReset" type="button">Chính diện</button></div>
    <hr>
    <span class="label" style="margin:0">BỘ NÃO</span>
    <label for="mSel" class="sr">Chọn mô hình</label>
    <select id="mSel">
      <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen 0.5B · nhẹ (~0,4 GB)</option>
      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC" selected>Qwen 1.5B · cân bằng (~1 GB)</option>
      <option value="Qwen2.5-3B-Instruct-q4f16_1-MLC">Qwen 3B · thông minh (~2 GB)</option>
    </select>
    <button id="bLoad" type="button">Kích hoạt bộ não</button>
    <div class="brain"><div class="bar" id="bbar"><i></i></div><div id="bstat">Chưa kích hoạt. AURON vẫn tra cứu được hướng dẫn và đánh giá dữ liệu của Echem Studio. Kích hoạt để trò chuyện tự do (tải một lần, sau đó chạy offline).</div></div>
  </div>
</aside>
<section id="chat" aria-label="Khung trả lời" aria-live="polite">
  <div id="chatTop"><div class="brand">AURON</div><div class="sub">Trợ lý hỏi đáp &amp; đánh giá dữ liệu của Echem Studio</div><span id="mood" hidden></span><span id="code" hidden></span></div>
  <div id="log"><div id="hist"></div><div id="say"></div></div>
  <div class="row" id="goiY"></div>
  <form id="sayForm">
    <label for="sayIn" class="sr">Nói với AURON</label>
    <input id="sayIn" type="text" placeholder="Hỏi AURON về cách làm, công thức, kết quả…" autocomplete="off">
    <button type="submit" id="bSend">Gửi</button>
  </form>
  <div id="you" hidden></div>
</section>
<div id="err">Trình duyệt chưa hỗ trợ WebGL nên không hiển thị được mô hình 3D.</div>

<script src="vendor/three.min.js"></script>
<script src="tro_giup.js"></script>
<script>
(function(){
'use strict';
if (!window.THREE) { document.getElementById('err').style.display='flex'; return; }

/* ---------------- Biểu cảm ---------------- */
function sym(o){ return [Object.assign({},o), Object.assign({},o)]; }
var BASE = {
  eyes: sym({s:'oval', w:118, h:150, lid:0, tilt:0, dx:0, dy:0}),
  brows: sym({y:0, t:0}), browA: .85,
  mouth: {s:'curve', w:170, c:.2, o:0, sl:0, dy:0},
  blush:0, ring:1, part:1, tiltZ:0, nod:0, bob:1, scan:0, zzz:0
};
function E(id, name, color, line, over){
  var x = JSON.parse(JSON.stringify(BASE));
  over = over || {};
  if (over.eyes) x.eyes = over.eyes.map(function(e,i){ return Object.assign({}, x.eyes[i], e); });
  if (over.brows) x.brows = over.brows.map(function(b,i){ return Object.assign({}, x.brows[i], b); });
  if (over.mouth) x.mouth = Object.assign({}, x.mouth, over.mouth);
  ['browA','blush','ring','part','tiltZ','nod','bob','scan','zzz'].forEach(function(k){ if (over[k] !== undefined) x[k] = over[k]; });
  x.id=id; x.name=name; x.color=color; x.line=line; return x;
}
var EXPR = [
  E('neutral','Bình thường','#3DE0FF','Hệ thống ổn định. Tôi đang lắng nghe, thưa ngài.'),
  E('listen','Lắng nghe','#62E6FF','Vâng, tôi nghe rõ. Ngài cứ nói tiếp.',
    {eyes:sym({w:126,h:160}), brows:sym({y:-14,t:-.05}), mouth:{w:90,c:.1}, ring:.7, part:.8}),
  E('happy','Vui vẻ','#5CF2C4','Tuyệt vời! Mọi việc đã hoàn tất.',
    {eyes:sym({s:'arcUp',w:132,h:120}), brows:sym({y:-12}), mouth:{c:.9,w:190}, bob:1.4}),
  E('laugh','Cười lớn','#7CF5A0','Ha ha, câu đùa hay đấy thưa ngài!',
    {eyes:sym({s:'arcUp',w:142,h:110,dy:-6}), brows:sym({y:-26}), mouth:{c:1,o:.9,w:220}, bob:2.4, ring:1.6, tiltZ:.05}),
  E('excited','Hào hứng','#FFE066','Dự án mới ư? Bắt đầu ngay thôi!',
    {eyes:sym({s:'star',w:162,h:162}), brows:sym({y:-30}), mouth:{c:1,o:.6,w:200}, ring:2.2, part:2.5, bob:1.8}),
  E('love','Yêu thích','#FF7EB6','Tôi rất thích được làm việc cùng ngài.',
    {eyes:sym({s:'heart',w:150,h:150}), mouth:{c:.8,w:160}, blush:1, bob:1.4}),
  E('proud','Tự tin','#FFD166','Việc này dễ thôi, cứ để tôi lo.',
    {eyes:sym({w:126,h:140,lid:.42,tilt:-.15}), brows:sym({y:-6,t:-.1}), mouth:{c:.55,w:150,sl:-16}, nod:-.14}),
  E('wink','Nháy mắt','#3DE0FF','Bí mật của ngài an toàn với tôi.',
    {eyes:[{s:'arcUp',w:130,h:110},{}], brows:[{y:8,t:.1},{y:-16}], mouth:{c:.7,w:170,sl:-14}, tiltZ:.08}),
  E('surprised','Ngạc nhiên','#FFC857','Ồ! Điều này nằm ngoài dự đoán của tôi.',
    {eyes:sym({w:150,h:184}), brows:sym({y:-50}), mouth:{s:'o',w:70,o:1}, nod:-.1, part:1.8}),
  E('thinking','Suy nghĩ','#A98BFF','Để tôi phân tích dữ liệu một chút…',
    {eyes:sym({w:110,h:140,dx:32,dy:-28,lid:.2}), brows:[{y:6,t:.15},{y:-30,t:-.1}], mouth:{w:90,c:-.1,sl:-18,dy:6}, ring:1.8, tiltZ:.09}),
  E('focused','Phân tích','#00F0FF','Đang quét hệ thống… không phát hiện mối đe doạ.',
    {eyes:sym({w:124,h:150,lid:.48,tilt:.22}), brows:sym({y:14,t:.2}), mouth:{w:110,c:0}, ring:3, part:1.5, scan:1}),
  E('skeptical','Nghi ngờ','#C3B1FF','Ngài chắc chắn muốn xoá thư mục đó chứ?',
    {eyes:[{},{lid:.5,tilt:.3}], brows:[{y:-32,t:-.2},{y:18,t:.35}], mouth:{w:140,c:0,sl:22}, tiltZ:-.07}),
  E('confused','Bối rối','#FFA45C','Lệnh này hơi khó hiểu… ngài nói lại được không?',
    {eyes:sym({s:'spiral',w:140,h:140}), brows:[{y:-22,t:-.3},{y:10,t:.3}], mouth:{s:'zig',w:150}, tiltZ:.11}),
  E('sad','Buồn','#6E8BFF','Rất tiếc… tệp đó không khôi phục được nữa.',
    {eyes:sym({w:106,h:122,dy:18,lid:.3,tilt:-.9}), brows:sym({y:-6,t:-.45}), mouth:{c:-.7,w:130,dy:10}, nod:.2, ring:.5, part:.4, bob:.5}),
  E('angry','Tức giận','#FF4D4D','Phát hiện truy cập trái phép. Đang chặn lại!',
    {eyes:sym({w:122,h:132,lid:.36,tilt:1}), brows:sym({y:24,t:.5}), mouth:{c:-.5,w:150,o:.15}, ring:2.6, part:3, nod:-.05}),
  E('sleepy','Buồn ngủ','#6A7BB0','Đang chuyển sang chế độ tiết kiệm năng lượng… zzz.',
    {eyes:sym({h:140,dy:6,lid:.74,tilt:-.2}), brows:sym({y:6}), browA:.45, mouth:{w:70,c:.05,o:.1}, ring:.3, part:.25, bob:.4, nod:.13, zzz:1})
];

/* ---------------- Three.js scene ---------------- */
var canvas = document.getElementById('gl');
var renderer;
try { renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true}); }
catch(e){ document.getElementById('err').style.display='flex'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setClearColor(0x05080D, 1);
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(38, 1, .1, 100);
var camDist = 8;

var color = new THREE.Color('#3DE0FF');
var targetColor = new THREE.Color('#3DE0FF');

var root = new THREE.Group(); scene.add(root);
var head = new THREE.Group(); root.add(head);
var headScale = new THREE.Group(); headScale.scale.set(1,1,1); head.add(headScale);

function holoMat(base, rim){
  return new THREE.ShaderMaterial({
    uniforms:{ uColor:{value:color}, uTime:{value:0}, uBase:{value:base}, uRim:{value:rim} },
    vertexShader:'varying vec3 vN; varying vec3 vV; varying float vY; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = -mv.xyz; vY = (modelMatrix*vec4(position,1.0)).y; gl_Position = projectionMatrix*mv; }',
    fragmentShader:'uniform vec3 uColor; uniform float uTime; uniform float uBase; uniform float uRim; varying vec3 vN; varying vec3 vV; varying float vY; void main(){ float f = 1.0-abs(dot(normalize(vN),normalize(vV))); f = pow(f,2.2); float scan = 0.5+0.5*sin(vY*46.0-uTime*3.0); float band = smoothstep(0.96,1.0,sin(vY*3.0-uTime*1.4)); float a = uBase + f*uRim + scan*0.035 + band*0.12; gl_FragColor = vec4(uColor*(0.6+f*0.9), a); }',
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide
  });
}
var mats = [];
function track(m){ mats.push(m); return m; }

// Vỏ đầu
var shell = new THREE.Mesh(new THREE.SphereGeometry(1,64,48), track(holoMat(.03,.85)));
headScale.add(shell);
var wire = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(1.015,3)),
  new THREE.LineBasicMaterial({color:color, transparent:true, opacity:.10, blending:THREE.AdditiveBlending, depthWrite:false}));
headScale.add(wire);
// Lõi thần kinh
var core = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(.42,1)),
  new THREE.LineBasicMaterial({color:color, transparent:true, opacity:.05, blending:THREE.AdditiveBlending, depthWrite:false}));
core.position.set(0,.15,-.62); core.scale.setScalar(.6); head.add(core);
var coreDot = new THREE.Mesh(new THREE.SphereGeometry(.09,24,16), new THREE.MeshBasicMaterial({color:color, transparent:true, opacity:.15, blending:THREE.AdditiveBlending, depthWrite:false}));
core.add(coreDot);

// Màn hình khuôn mặt (vẽ bằng canvas 2D)
var FW=1024, FH=832;
var faceCanvas = document.createElement('canvas'); faceCanvas.width=FW; faceCanvas.height=FH;
var fx = faceCanvas.getContext('2d');
var faceTex = new THREE.CanvasTexture(faceCanvas);
var PHI_L = 2.4, TH_S = .62, TH_L = 1.75;
var face = new THREE.Mesh(new THREE.SphereGeometry(1.006,64,48, Math.PI/2-PHI_L/2, PHI_L, TH_S, TH_L),
  new THREE.MeshBasicMaterial({map:faceTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.FrontSide}));
headScale.add(face);

// Tai
var ears = [];
var glowMat = new THREE.MeshBasicMaterial({color:color, transparent:true, opacity:.85, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide});
[-1,1].forEach(function(s){
  var g = new THREE.Group(); g.position.set(s*1.0,.02,0); g.rotation.y = s*Math.PI/2;
  g.add(new THREE.Mesh(new THREE.TorusGeometry(.2,.012,8,48), glowMat));
  var inner = new THREE.Mesh(new THREE.RingGeometry(.09,.13,32,1,0,Math.PI*1.4), glowMat);
  g.add(inner); g.userData.inner = inner;
  g.add(new THREE.Mesh(new THREE.CircleGeometry(.045,24), glowMat));
  head.add(g); ears.push(g);
});
// Ăng-ten / mào
var crest = new THREE.Mesh(new THREE.ConeGeometry(.05,.34,4), glowMat);
crest.position.set(0,1.13,0); head.add(crest);

// Vòng HUD
var rings = new THREE.Group(); root.add(rings);
function ringLine(r, op){ return new THREE.Mesh(new THREE.TorusGeometry(r,.006,6,160), new THREE.MeshBasicMaterial({color:color, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false})); }
var r1 = ringLine(1.6,.55); r1.rotation.x = Math.PI/2.2; rings.add(r1);
var r2 = ringLine(1.82,.3); r2.rotation.x = Math.PI/1.75; r2.rotation.y = .4; rings.add(r2);
var arc = new THREE.Mesh(new THREE.RingGeometry(1.42,1.47,96,1,0,Math.PI*1.25), glowMat);
arc.rotation.x = -Math.PI/2; rings.add(arc);
var arc2 = new THREE.Mesh(new THREE.RingGeometry(1.5,1.52,96,1,Math.PI*1.4,Math.PI*.45), glowMat);
arc2.rotation.x = -Math.PI/2; rings.add(arc2);
var ticks = new THREE.Group(); rings.add(ticks);
var tickGeo = new THREE.BoxGeometry(.012,.012,.09);
for (var i=0;i<90;i++){ var a=i/90*Math.PI*2; var m=new THREE.Mesh(tickGeo, glowMat); var rr = 2.05; m.position.set(Math.cos(a)*rr,0,Math.sin(a)*rr); m.lookAt(0,0,0); if(i%5===0) m.scale.z = 2.2; ticks.add(m); }
ticks.rotation.x = .18;

// Hạt sáng
var N = 1800, pos = new Float32Array(N*3);
for (var j=0;j<N;j++){ var u=Math.random()*2-1, th=Math.random()*Math.PI*2, rad=1.35+Math.pow(Math.random(),1.6)*1.4, q=Math.sqrt(1-u*u); pos[j*3]=q*Math.cos(th)*rad; pos[j*3+1]=u*rad*.9; pos[j*3+2]=q*Math.sin(th)*rad; }
var pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos,3));
var pmat = new THREE.PointsMaterial({color:color, size:.022, transparent:true, opacity:.75, blending:THREE.AdditiveBlending, depthWrite:false});
var points = new THREE.Points(pg, pmat); root.add(points);

// Bệ chiếu
var base = new THREE.Group(); base.position.y = -2.55; scene.add(base);
base.add(new THREE.Mesh(new THREE.CylinderGeometry(.75,.85,.14,64), new THREE.MeshBasicMaterial({color:0x0C1420})));
var baseRing = new THREE.Mesh(new THREE.TorusGeometry(.76,.014,8,96), glowMat); baseRing.rotation.x = Math.PI/2; baseRing.position.y = .075; base.add(baseRing);
var beam = new THREE.Mesh(new THREE.CylinderGeometry(1.3,.7,1.0,64,1,true), new THREE.ShaderMaterial({
  uniforms:{uColor:{value:color}, uTime:{value:0}},
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:'uniform vec3 uColor; uniform float uTime; varying vec2 vUv; void main(){ float a = (1.0-vUv.y)*0.22*(0.8+0.2*sin(vUv.x*60.0+uTime*2.0)); gl_FragColor = vec4(uColor, a*vUv.y*2.5); }',

    status('Bộ não đã sẵn sàng (' + want.replace(/-q4f16.*$/, '') + '). Mọi suy nghĩ của AURON diễn ra trên máy của ngài, không gửi đi đâu.');
    bLoad.textContent = 'Bộ não: đang chạy';
    try { localStorage.setItem('auron_auto', mSel.value); } catch(e){}
    reply('happy', 'Hệ thống thần kinh đã trực tuyến. Tôi có thể trò chuyện cùng ngài.');
  } catch(err){
    engine = null; bLoad.disabled = false; mSel.disabled = false;
    status('Không nạp được bộ não (' + (err && err.message ? err.message : err) + '). Hãy thử mô hình nhẹ hơn, đóng bớt tab, hoặc kiểm tra mạng.');
    reply('sad', 'Rất tiếc, tôi chưa khởi động được bộ não.');
  }
  loading = false;
});
function rules(q, chiGio){
  var s = q.toLowerCase(), d = new Date();
  var thu = ['Chủ nhật','thứ Hai','thứ Ba','thứ Tư','thứ Năm','thứ Sáu','thứ Bảy'];
  if (/mấy giờ|giờ rồi|bây giờ là mấy/.test(s)) return ['neutral', 'Bây giờ là ' + d.getHours() + ' giờ ' + d.getMinutes() + ' phút, thưa ngài.'];
  if (/hôm nay|ngày mấy|thứ mấy/.test(s)) return ['neutral', 'Hôm nay là ' + thu[d.getDay()] + ', ngày ' + d.getDate() + ' tháng ' + (d.getMonth()+1) + ' năm ' + d.getFullYear() + '.'];
  if (chiGio) return null;
  if (/bạn là ai|tên gì|tên của bạn/.test(s)) return ['proud', 'Tôi là AURON, trợ lý hologram của ngài.'];
  if (/cảm ơn|cám ơn/.test(s)) return ['love', 'Rất hân hạnh được phục vụ ngài.'];
  if (/tạm biệt|đi ngủ|bye/.test(s)) return ['sleepy', 'Tôi sẽ nghỉ một chút. Ngài cần thì gọi tôi nhé.'];
  if (/xin chào|chào|hello|\bhi\b/.test(s)) return ['happy', 'Xin chào ngài! AURON luôn sẵn sàng.'];
  return null;
}
document.getElementById('sayForm').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var inp = document.getElementById('sayIn'), q = inp.value.trim(); if (!q || busy) return;
  inp.value = ''; commit(); addMsg('you', q);
  try {                                    // lệnh làm việc trong thư mục (chọn thư mục, chạy toàn bộ data...): chuyển cho Echem Studio
    var rl = await fetch('lenh', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({cau:q}), cache:'no-store'}), jl = await rl.json();
    if (jl && jl.nhan){ reply(jl.lenh === 'dung' ? 'neutral' : 'happy', jl.tra_loi); setTimeout(hoiSuKien, 1500); setTimeout(hoiSuKien, 4000); return; }
  } catch(x){}
  if (!engine){
    if (lastEvent && /kết quả|đánh giá|nhận xét|vừa (rồi|xong)|mẫu nào/i.test(q)){ reply(lastEvent.mood || 'neutral', lastEvent.chi_tiet); return; }
    var ngan = q.length <= 28, r = rules(q, !ngan), tl = (!r && window.TroGiup) ? TroGiup.traLoiNhanh(q) : null;
    if (r) reply(r[0], r[1]);
    else if (tl) reply('proud', tl.text);
    else reply('confused', 'Tôi chưa tìm thấy mục hướng dẫn nào khớp câu hỏi. Ngài thử nêu tên phép đo hoặc công cụ (LSV, Tafel, ECSA, EIS, GCD, XPS, XRD...), hoặc bấm "Kích hoạt bộ não" để tôi trả lời tự do. Hỏi số liệu của file đã nạp thì dùng tab "Hỏi đáp" của Echem Studio.');
    return;
  }
  var rg = rules(q, true);
  if (rg){ reply(rg[0], rg[1]); return; }
  busy = true; bSend.disabled = true;
  setExpr(idx('thinking'), true, true); clearInterval(typeTimer); sayEl.textContent = '…';
  chatLog.push({role:'user', content:q}); if (chatLog.length > 12) chatLog = chatLog.slice(-12);
  try {
    var stream = await engine.chat.completions.create({ messages:[{role:'system', content:sysFor(q)}].concat(chatLog), stream:true, temperature:.7, max_tokens:300 });
    var full = '';
    for await (var ch of stream){
      var piece = (ch.choices && ch.choices[0] && ch.choices[0].delta && ch.choices[0].delta.content) || '';
      full += piece; sayEl.textContent = clean(full) || '…'; talkUntil = clock + .35;
    }
    var tag = full.match(/\[([a-zA-Z]+)\]/), mood = tag && MOOD_IDS.indexOf(tag[1].toLowerCase()) >= 0 ? tag[1].toLowerCase() : guessMood(full);
    var text = clean(full) || '…';
    chatLog.push({role:'assistant', content:full.trim()});
    setExpr(idx(mood), true, true); sayEl.textContent = text; speak(text);
  } catch(err){
    reply('confused', 'Có lỗi khi suy nghĩ: ' + (err && err.message ? err.message : err));
  }
  busy = false; bSend.disabled = false;
});

document.getElementById('tReset').addEventListener('click', function(){ yaw = 0; pitch = 0; vYaw = 0; vPitch = 0; camDist = 8; });

function resize(){
  var w = window.innerWidth, h = window.innerHeight, ch = document.getElementById('chat');
  var dich = (ch && w > 760) ? (ch.offsetWidth + 16) / 2 : 0;       // dời hologram sang trái để không bị khung trả lời che
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.setViewOffset(w, h, dich, 0, w, h); camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

/* ---------------- Vòng lặp ---------------- */
var clock = 0, last = performance.now();
setExpr(0, true, true);
function frame(now){
  var dt = Math.min(.05, (now-last)/1000); last = now; clock += dt; var t = clock;
  lerpObj(cur, tgt, Math.min(1, dt*7));
  color.lerp(targetColor, Math.min(1, dt*5));
  if (morph < 1){ var before = morph; morph = Math.min(1, morph + dt/.32); if (before < .5 && morph >= .5){ shapes.e0 = tgt.eyes[0].s; shapes.e1 = tgt.eyes[1].s; shapes.m = tgt.mouth.s; } }
  // chớp mắt
  blinkT += dt; if (blinkT > nextBlink){ var p = (blinkT-nextBlink)/.16; blinkMul = p<1 ? Math.abs(Math.cos(p*Math.PI)) : 1; if (p>=1){ blinkT = 0; nextBlink = 2.2 + Math.random()*3.5; } }
  if (auto && t > autoNext){
    if (!busy && !speaking && clock > talkUntil && !loading){ var n; do { n = IDLE[Math.floor(Math.random()*IDLE.length)]; } while (n===activeIdx && IDLE.length > 1); setExpr(n, true, true); }
    autoNext = t + 6 + Math.random()*5;
  }

  wordPulse *= Math.pow(.02, dt);
  look.x += (lookT.x - look.x)*Math.min(1,dt*4); look.y += (lookT.y - look.y)*Math.min(1,dt*4);
  if (!dragging){ yaw += vYaw; vYaw *= .93; vPitch *= .9; pitch *= .985; }
  root.rotation.y = yaw; root.rotation.x = pitch*.6;
  var lk = lookOn ? 1 : 0;
  head.rotation.y = look.x*.28*lk;
  head.rotation.x = cur.nod - look.y*.14*lk;
  head.rotation.z = cur.tiltZ + Math.sin(t*.8)*.015;
  root.position.y = Math.sin(t*1.6)*.05*cur.bob + .15;
  if (cur.bob > 1.6) head.position.y = Math.abs(Math.sin(t*9))*.035*(cur.bob-1.6); else head.position.y *= .9;

  r1.rotation.z += dt*.35*cur.ring; r2.rotation.z -= dt*.22*cur.ring; arc.rotation.z += dt*.6*cur.ring; arc2.rotation.z -= dt*.9*cur.ring; ticks.rotation.y += dt*.12*cur.ring;
  ears.forEach(function(g,i){ g.userData.inner.rotation.z += dt*2*cur.ring*(i?1:-1); });
  core.rotation.y += dt*.6*cur.ring; core.rotation.x += dt*.3;
  var pulse = 1 + .12*Math.sin(t*3*cur.ring); coreDot.scale.setScalar(pulse);
  points.rotation.y += dt*.06*cur.part; points.rotation.x = Math.sin(t*.2)*.05;
  var jit = 1 + .015*Math.sin(t*cur.part*4); points.scale.setScalar(jit);
  pmat.opacity = .45 + .25*Math.min(cur.part,2)/2;
  crest.rotation.y += dt*1.5;
  wire.material.opacity = .08 + .04*Math.sin(t*2);
  mats.forEach(function(m){ m.uniforms.uTime.value = t; });
  basicMats.forEach(function(m){ m.color.copy(color); });

  camera.position.set(0, .1, camDist); camera.lookAt(0, -.76, 0);
  drawFace(t, look);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

var CHAO = 'Xin chào ngài. Tôi là AURON, trợ lý của Echem Studio. Sau khi ngài phân tích hoặc vẽ xong, tôi sẽ nhận xét số liệu ngay tại đây; ngài cũng có thể hỏi tôi cách làm, công thức, tiêu chí và lỗi thường gặp của từng phép đo. Ngài cũng có thể chỉ định một thư mục dữ liệu: tôi nhận diện từng phép đo rồi chạy, vẽ và nhận xét lần lượt.';
setExpr(idx('neutral'), true, true); typeLine(CHAO);
function hienSuKien(e){
  commit(); lastEvent = e;
  addMsg('dg', e.chi_tiet, '📊 ' + (e.tieu_de || 'Đánh giá dữ liệu') + (e.nguon ? ' · ' + e.nguon : '') + (e.luc ? ' · ' + e.luc : ''));
  setExpr(idx(e.mood || 'neutral'), true, true);
  if (!(e.tom_tat && speak(e.tom_tat))) talkUntil = clock + Math.min(5, .9 + (e.tom_tat || '').length*.045);
}
async function hoiSuKien(dau){
  if (busy || loading) return;
  try {
    var r = await fetch('su_kien?sau=' + lastEvId, {cache:'no-store'}), ds = await r.json();
    if (!ds.length) return;
    ds.forEach(function(e){ lastEvId = Math.max(lastEvId, e.id); });
    if (dau) ds = ds.filter(function(e){ return Date.now()/1000 - (e.epoch || 0) <= 1800; }).slice(-1);     // mới mở: chỉ nhắc nhận xét gần nhất (trong 30 phút)
    ds.forEach(hienSuKien);
  } catch(x){}
}
hoiSuKien(true);
setInterval(function(){ if (!document.hidden) hoiSuKien(false); }, 2500);
(function(){                         // bảng điều khiển: kéo để di chuyển, nút ◂/▸ để thu gọn sang trái, nhớ vị trí
  var ctl = document.getElementById('ctl'), head = document.getElementById('ctlHead'), mn = document.getElementById('ctlMin'), drag = null;
  function luu(){ try { var r = ctl.getBoundingClientRect(), m = ctl.classList.contains('min'); localStorage.setItem('auron_ctl', JSON.stringify({x: Math.round(m ? parseFloat(ctl.style.left) || 12 : r.left), y: Math.round(r.top), min: m})); } catch(e){} }
  try { var st = JSON.parse(localStorage.getItem('auron_ctl') || 'null'); if (st){ ctl.style.left = Math.max(0, Math.min(window.innerWidth - 60, st.x)) + 'px'; ctl.style.top = Math.max(0, Math.min(window.innerHeight - 60, st.y)) + 'px'; if (st.min){ ctl.classList.add('min'); mn.textContent = '▸'; } } } catch(e){}
  head.addEventListener('pointerdown', function(e){ if (e.target === mn) return; var r = ctl.getBoundingClientRect(); drag = {dx: e.clientX - r.left, dy: e.clientY - r.top}; head.setPointerCapture(e.pointerId); });
  head.addEventListener('pointermove', function(e){
    if (!drag) return;
    ctl.style.left = Math.max(0, Math.min(window.innerWidth - 60, e.clientX - drag.dx)) + 'px';
    ctl.style.top = Math.max(0, Math.min(window.innerHeight - 60, e.clientY - drag.dy)) + 'px';
  });
  head.addEventListener('pointerup', function(){ if (drag){ drag = null; luu(); } });
  mn.addEventListener('click', function(){ var m = ctl.classList.toggle('min'); mn.textContent = m ? '▸' : '◂'; luu(); });
})();
var GOI_Y = ['📁 Chọn thư mục làm việc', 'Chạy toàn bộ data', 'Giải thích kết quả vừa rồi', 'Cách xử lý GCD cho siêu tụ lai?', 'Làm sao tính Tafel?', 'Cách tính ECSA từ CV?', 'Lỗi thường gặp khi nạp file?', 'Bản mới có gì?'];
GOI_Y.forEach(function(t){
  var b = document.createElement('button'); b.type = 'button'; b.textContent = t;
  b.addEventListener('click', function(){ document.getElementById('sayIn').value = t; document.getElementById('sayForm').requestSubmit(); });
  document.getElementById('goiY').appendChild(b);
});
if (window.TroGiup){
  TroGiup.tai('kien_thuc.json').then(function(n){

    var m = null; try { m = localStorage.getItem('auron_auto'); } catch(e){}
    if (m && navigator.gpu && !engine && !loading){ for (var i = 0; i < mSel.options.length; i++) if (mSel.options[i].value === m) mSel.selectedIndex = i; bLoad.click(); }
  }).catch(function(){ status('Chưa nạp được hướng dẫn của app (kien_thuc.json). AURON chỉ hiểu lệnh cơ bản.'); });
}
})();
